<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Motion Bento</title>
<meta name="description" content="A wall of motion design reels and live, playable WebGL shaders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────────────────── Tokens ─────────────────────────
   Quiet bento: white ground, one 1px stroke per card, no shadows.
   The only chrome is a frosted pill that rises on hover. */
:root {
  --bg: #FFFFFF;
  --text: #1D1D1F;
  --text-2: #6E6E73;          /* 5.1:1 on white */
  --stroke: #E9E9E9;
  --pill: #FFFFFF;
  --pill-on: #F5F5F7;
  --hairline: rgba(0, 0, 0, .06);
  --accent: #1D1D1F;
  --surface: #FFFFFF;
  --shadow-tint: 0, 0, 0;
  --shadow-3: 0 30px 80px -20px rgba(0, 0, 0, .55), 0 10px 30px -10px rgba(0, 0, 0, .35);

  --font-display: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
  --gap: clamp(14px, 2.2vw, 32px);
  --r-card: clamp(22px, 2.6vw, 38px);
  --gutter: clamp(16px, 3.2vw, 40px);

  --ease-out: cubic-bezier(.32, .72, 0, 1);
  --spring: linear(0, .006, .025 2.8%, .101 6.1%, .539 18.9%, .721 25.3%, .849 31.5%, .937 38.1%, .968 41.8%, .991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --text: #F5F5F7; --text-2: #A1A1A6; --stroke: #242426;
    --pill: #000000; --pill-on: #1C1C1E; --hairline: rgba(255,255,255,.08); --accent: #F5F5F7; --surface: #1C1C1E;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --text: #F5F5F7; --text-2: #A1A1A6; --stroke: #242426;
  --pill: #000000; --pill-on: #1C1C1E; --hairline: rgba(255,255,255,.08); --accent: #F5F5F7; --surface: #1C1C1E;
}

/* ───────────────────────── Base ───────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh;
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body.is-locked { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.4; }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wrap { width: min(100% - 2 * var(--gutter), 1240px); margin: 0 auto; }

/* ───────────────────────── Nav: small stroked pills ───────────────────────── */
.nav { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 28px 0 32px; }
.nav-group { display: flex; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 999px;
  font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; text-decoration: none;
  background: var(--pill); border: 1px solid var(--stroke);
  transition: transform .35s var(--spring), background-color .2s, opacity .2s;
}
.pill:hover { background: var(--pill-on); }
.pill:active { transform: scale(.96); }
.pill[aria-pressed="true"] { background: var(--pill-on); }
.pill[aria-pressed="false"] { color: var(--text-2); }
.pill[aria-pressed="false"]:hover { color: var(--text); }

/* ───────────────────────── Bento ───────────────────────── */
.bento { display: grid; gap: var(--gap); grid-template-columns: repeat(6, minmax(0, 1fr)); }
.card {
  position: relative; isolation: isolate; overflow: hidden;
  border-radius: var(--r-card);
  background: var(--bg);
  animation: rise .8s var(--ease-out) both;
  animation-delay: calc(var(--i, 0) * 50ms + 80ms);
}
.card::after { /* the one stroke */
  content: ""; position: absolute; inset: 0; z-index: 4; border-radius: inherit;
  border: 1px solid var(--stroke); pointer-events: none;
}
.card.w3 { grid-column: span 3; aspect-ratio: 1.1 / 1; }
.card.w2 { grid-column: span 2; aspect-ratio: 1 / 1; }
.card.w6 { grid-column: 1 / -1; aspect-ratio: 2.4 / 1; }
.card.hero.w6 { aspect-ratio: 2.1 / 1; }
.card.is-out { display: none; }
.card.is-entering { animation: pop .55s var(--spring) both; animation-delay: calc(var(--i, 0) * 40ms); }
.bento[data-filter="motion"] .card, .bento[data-filter="shader"] .card { grid-column: span 3; aspect-ratio: 1.1 / 1; }

.tile-media { position: absolute; inset: 0; }
.tile-media video, .tile-media canvas { width: 100%; height: 100%; display: block; object-fit: cover; }
.card[data-kind="motion"] { background: var(--edge, #fff); }
.card[data-kind="motion"] video { object-fit: contain; }

.tile-hit { position: absolute; inset: 0; z-index: 3; border-radius: inherit; }
.tile-hit:focus-visible { outline-offset: -4px; outline-width: 2px; border-radius: var(--r-card); }

/* Hover pill: label + round arrow, frosted. Dark material on the (light) reels, light material on the (dark) shaders. */
.reveal {
  position: absolute; z-index: 5; right: clamp(14px, 1.6vw, 24px); bottom: clamp(14px, 1.6vw, 24px);
  display: flex; gap: 8px; pointer-events: none;
  opacity: 0; transform: translateY(10px);
  transition: opacity .3s var(--ease-out), transform .5s var(--spring);
}
.card:hover .reveal, .card:focus-within .reveal { opacity: 1; transform: none; }
.reveal span {
  display: inline-flex; align-items: center; justify-content: center; height: 40px; border-radius: 999px;
  font-size: 14px; font-weight: 500; white-space: nowrap;
  -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
}
.reveal .label { padding: 0 18px; }
.reveal .arrow { width: 40px; }
.reveal .arrow .icon { width: 16px; height: 16px; }
.card .reveal span { background: rgba(29,29,31,.62); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.card[data-kind="shader"] .reveal span { background: rgba(255,255,255,.16); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.24); }
@media (hover: none) { .reveal { opacity: 1; transform: none; } }

/* Hero card: Silk, a frosted panel, and the motion switch */
.hero .panel {
  position: absolute; z-index: 5; left: clamp(14px, 1.6vw, 24px); right: clamp(14px, 1.6vw, 24px); max-width: 520px; bottom: clamp(14px, 1.6vw, 24px);
  padding: clamp(18px, 2vw, 26px);
  border-radius: calc(var(--r-card) - 12px);
  color: #fff; pointer-events: none;
  background: rgba(255,255,255,.1);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
  transition: opacity .3s var(--ease-out);
}
.hero h1 { margin: 0 0 clamp(28px, 4vw, 56px); font-weight: 500; font-size: clamp(24px, 2.5vw, 34px); line-height: 1.15; letter-spacing: -0.025em; }
.hero h1 em { font-style: normal; opacity: .55; }
.hero .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: rgba(255,255,255,.75); }
.hero .reveal { bottom: auto; top: clamp(14px, 1.6vw, 24px); right: clamp(64px, 5vw, 76px); }
.motion-toggle {
  position: absolute; z-index: 6; top: clamp(14px, 1.6vw, 24px); right: clamp(14px, 1.6vw, 24px);
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: #fff;
  background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  transition: transform .35s var(--spring), background-color .2s;
}
.motion-toggle:hover { background: rgba(255,255,255,.24); }
.motion-toggle:active { transform: scale(.92); }
.motion-toggle .icon { width: 16px; height: 16px; }
.motion-toggle .when-off { display: none; }
.motion-toggle[aria-pressed="false"] .when-on { display: none; }
.motion-toggle[aria-pressed="false"] .when-off { display: block; }

footer.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s4); padding: 40px 4px 48px; font-size: 13px; color: var(--text-2); }

/* shared buttons used inside the viewer */
.pill-btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px;
  font-size: 14px; font-weight: 500; white-space: nowrap; background: var(--hairline);
  transition: transform .35s var(--spring), opacity .2s, background-color .2s;
}
.pill-btn:active { transform: scale(.96); }
.pill-btn.is-primary:hover { opacity: .86; }

/* ───────────────────────── Viewer (modal) ───────────────────────── */
.viewer { position: fixed; inset: 0; z-index: 60; }
.viewer[hidden] { display: none; }
.viewer-scrim { position: absolute; inset: 0; background: rgba(6,6,10,.72); -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); opacity: 0; transition: opacity .45s var(--ease-out); }
.viewer.is-open .viewer-scrim { opacity: 1; }
.viewer-panel {
  position: absolute; inset: clamp(8px, 2.2vw, 28px);
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  border-radius: 26px; background: #050507; color: #F2F2F4;
  box-shadow: var(--shadow-3), inset 0 0 0 1px rgba(255,255,255,.06);
  transform-origin: 0 0;
}
.viewer-panel.is-animating { transition: transform .55s var(--ease-out), opacity .35s var(--ease-out); }
.viewer-top {
  position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  padding: 12px 12px 12px 22px; border-bottom: 1px solid rgba(255,255,255,.07);
}
.viewer-title { min-width: 0; }
.viewer-title .mono { color: rgba(255,255,255,.6); }
.viewer-title h2 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 2vw, 26px); line-height: 1.1; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-nav { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  color: #F2F2F4; background: rgba(255,255,255,.08);
  transition: transform .35s var(--spring), background-color .2s, opacity .2s;
}
.icon-btn:hover { background: rgba(255,255,255,.16); }
.icon-btn:active { transform: scale(.92); }
.icon-btn[disabled] { opacity: .3; pointer-events: none; }
.viewer-count { font-family: var(--font-mono); font-size: 12px; color: rgba(255,255,255,.55); padding: 0 8px; min-width: 52px; text-align: center; }

.viewer-body { position: relative; min-height: 0; display: grid; }
.viewer[data-mode="shader"] .viewer-body { grid-template-columns: 1fr 340px; }
.stage { position: relative; min-height: 0; overflow: hidden; background: #000; }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage video { object-fit: contain; }
.stage canvas { cursor: crosshair; touch-action: none; }
.viewer[data-mode="video"] .stage canvas, .viewer[data-mode="shader"] .stage video, .viewer[data-mode="shader"] .vctl, .viewer[data-mode="video"] .controls { display: none; }

/* video controls: clear glass over media */
.vctl {
  position: absolute; z-index: 2; left: 50%; bottom: clamp(12px, 2.4vw, 24px); transform: translateX(-50%);
  width: min(720px, calc(100% - 24px));
  display: flex; align-items: center; gap: 10px; padding: 8px;
  border-radius: 999px; background: rgba(20,20,24,.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 10px 30px -10px rgba(0,0,0,.6);
  transition: opacity .35s var(--ease-out), transform .45s var(--spring);
}
.stage.is-idle .vctl { opacity: 0; transform: translate(-50%, 8px); }
.vctl .time { font-family: var(--font-mono); font-size: 12px; color: rgba(255,255,255,.75); white-space: nowrap; min-width: 92px; text-align: center; }
.vctl .icon-btn { flex: none; }
.vctl .play { background: #F2F2F4; color: #0A0A0C; }
.vctl .play:hover { background: #fff; }

/* range input */
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; cursor: pointer; margin: 0;
  --p: 0%;
}
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--fill, #F2F2F4) var(--p), rgba(255,255,255,.18) var(--p)); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--fill, #F2F2F4); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); transition: transform .3s var(--spring); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.15); }
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.3); }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(255,255,255,.5); }
input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px rgba(255,255,255,.5); }

/* shader controls panel */
.controls {
  position: relative; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  border-left: 1px solid rgba(255,255,255,.07); background: #0B0B0E;
  padding: var(--s5) var(--s5) var(--s6);
  display: flex; flex-direction: column; gap: var(--s5);
}
.ctl-group { display: grid; gap: var(--s2); }
.ctl-group > .mono { color: rgba(255,255,255,.5); }
.ctl-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,.78); background: rgba(255,255,255,.07);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  transition: transform .35s var(--spring), background-color .2s, color .2s;
}
.chip:hover { background: rgba(255,255,255,.13); color: #fff; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: #F2F2F4; color: #0A0A0C; box-shadow: none; }
.ctl-row { display: grid; gap: 2px; }
.ctl-row .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: rgba(255,255,255,.82); }
.ctl-row output { font-family: var(--font-mono); font-size: 12px; color: rgba(255,255,255,.5); }
.ctl-row input[type="range"] { --fill: #F2F2F4; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.swatch { position: relative; display: grid; gap: 6px; font-size: 12px; color: rgba(255,255,255,.7); }
.swatch-chip { position: relative; height: 40px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); overflow: hidden; transition: transform .35s var(--spring); }
.swatch:hover .swatch-chip { transform: scale(1.04); }
.swatch:active .swatch-chip { transform: scale(.97); }
.swatch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.swatch:focus-within .swatch-chip { box-shadow: 0 0 0 2px #0B0B0E, 0 0 0 4px rgba(255,255,255,.7); }
.ctl-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ctl-actions .pill-btn { justify-content: center; background: rgba(255,255,255,.08); color: #F2F2F4; }
.ctl-actions .pill-btn:hover { background: rgba(255,255,255,.15); }
.ctl-actions .pill-btn.is-primary { background: #F2F2F4; color: #0A0A0C; }
.toast { position: fixed; z-index: 80; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; padding: 10px 16px; border-radius: 999px; background: #F2F2F4; color: #0A0A0C; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-3); transition: opacity .3s, transform .5s var(--spring); pointer-events: none; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* ───────────────────────── Motion ───────────────────────── */
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .reveal span, .hero .panel, .motion-toggle { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .card .reveal span { background: rgba(29,29,31,.95); }
  .card[data-kind="shader"] .reveal span, .hero .panel, .motion-toggle { background: rgba(20,20,22,.9); }
  .vctl { background: rgba(18,18,22,.92); -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* ───────────────────────── Responsive ───────────────────────── */
@media (max-width: 1023px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card.w3, .card.w2, .bento[data-filter] .card { grid-column: span 1; aspect-ratio: 1 / 1.05; }
  .bento[data-filter="all"] .card.w6 { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
  .viewer[data-mode="shader"] .viewer-body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 46%); }
  .controls { border-left: 0; border-top: 1px solid rgba(255,255,255,.07); }
}
@media (max-width: 640px) {
  .nav { padding: 18px 0 20px; }
  .nav .pill { padding: 0 12px; font-size: 13px; }
  .nav .pill .last { display: none; }
  .bento { grid-template-columns: 1fr; }
  .card.w3, .card.w2, .bento[data-filter] .card { grid-column: 1 / -1; aspect-ratio: 1 / 1; }
  .bento[data-filter="all"] .card.hero.w6 { aspect-ratio: 4 / 5; }
  .bento[data-filter="all"] .card.w6:not(.hero) { aspect-ratio: 1 / 1; }
  .viewer-panel { inset: 0; border-radius: 0; }
  .viewer-count { display: none; }
  .vctl .time { min-width: 0; }
  .vctl .fs { display: none; }
}
</style>
</head>

<script>
/* ═════════════════════════ Content ═════════════════════════ */
const VIDEOS = [
  { id: 'v1', cls: 't-v1', src: 'motion-showcase.mp4', title: 'Motion Showcase', kicker: 'Reel', ar: '16 / 9' },
  { id: 'v2', cls: 't-v2', src: '1791949492266_style-comfort-reel-4K.mp4', title: 'Style Comfort', kicker: 'Reel', ar: '3840 / 1748' },
  { id: 'v3', cls: 't-v3', src: 'font-pairing-walkthrough.mp4', title: 'Font Pairing', kicker: 'Walkthrough', ar: '16 / 9' },
  { id: 'v4', cls: 't-v4', src: 'e7e43ab3-13ac-40f6-b85b-6065cc1b56b3.mp4', title: 'Study 04', kicker: 'Loop', ar: '1280 / 1238' },
];

const NOISE = `
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float v = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++){ v += a*noise(p); p = m*p; a *= .5; } return v; }
`;

const SHADERS = [
  {
    id: 'silk', name: 'Silk', kicker: 'Domain-warped fBm',
    blurb: 'Noise folded into itself three times. The cursor drags the second fold.',
    params: [
      { key: 'speed', label: 'Speed', min: 0, max: 3, step: .01, value: 1 },
      { key: 'scale', label: 'Scale', min: .5, max: 6, step: .01, value: 1.6 },
      { key: 'warp', label: 'Warp', min: 0, max: 8, step: .01, value: 3.2 },
      { key: 'grain', label: 'Grain', min: 0, max: .2, step: .001, value: .03 },
      { key: 'c1', label: 'Shadow', type: 'color', value: '#050507' },
      { key: 'c2', label: 'Light', type: 'color', value: '#d8d6d2' },
      { key: 'c3', label: 'Depth', type: 'color', value: '#2a3350' },
    ],
    presets: {
      Graphite: { c1: '#050507', c2: '#d8d6d2', c3: '#2a3350', warp: 3.2, scale: 1.6 },
      Streetlight: { c1: '#07080f', c2: '#ff8a1f', c3: '#5b6cff', warp: 3.2, scale: 1.6 },
      Marble: { c1: '#1a1a1f', c2: '#f2efe8', c3: '#8c8a86', warp: 6.5, scale: 1.4 },
      Lagoon: { c1: '#021417', c2: '#24e0c0', c3: '#0a4cff', warp: 3.2, scale: 3 },
      Ember: { c1: '#0d0201', c2: '#ff3b14', c3: '#ffd34d', warp: 5.5, scale: 2.6 },
    },
    frag: NOISE + `
uniform float u_speed, u_scale, u_warp, u_grain; uniform vec3 u_c1, u_c2, u_c3;
void main(){
  vec2 p = (gl_FragCoord.xy - .5*u_res) / min(u_res.x, u_res.y) * u_scale;
  float t = u_time * u_speed * .15;
  vec2 m = (u_mouse - .5) * vec2(u_res.x/u_res.y, 1.);
  vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + u_warp*q + vec2(1.7, 9.2) + .6*t + m*.8), fbm(p + u_warp*q + vec2(8.3, 2.8) - .4*t));
  float f = fbm(p + u_warp*r);
  vec3 col = mix(u_c1, u_c3, smoothstep(.4, 1.05, length(q)) * .75);
  col = mix(col, u_c2, smoothstep(.4, .82, f));
  col = mix(col, u_c1, smoothstep(.45, .15, f) * .7);
  col += mix(u_c2, vec3(1.), .55) * pow(smoothstep(.6, 1.05, f), 3.) * .55;
  col *= .75 + .4*smoothstep(.2, .9, f);
  col += (hash(gl_FragCoord.xy + fract(u_time)*91.) - .5) * u_grain;
  gl_FragColor = vec4(col, 1.);
}`
  },
  {
    id: 'caustics', name: 'Caustics', kicker: 'Light through water',
    blurb: 'Iterated trig turbulence, sharpened with a high power until it reads as refracted light.',
    params: [
      { key: 'speed', label: 'Speed', min: 0, max: 3, step: .01, value: .8 },
      { key: 'scale', label: 'Scale', min: .3, max: 3, step: .01, value: 1 },
      { key: 'intensity', label: 'Intensity', min: .2, max: 3, step: .01, value: 1.2 },
      { key: 'depth', label: 'Depth falloff', min: 0, max: 1, step: .01, value: .6 },
      { key: 'deep', label: 'Water', type: 'color', value: '#03213a' },
      { key: 'light', label: 'Light', type: 'color', value: '#9ff4ff' },
    ],
    presets: {
      Pool: { deep: '#03213a', light: '#9ff4ff', intensity: 1.2 },
      Lagoon: { deep: '#012a22', light: '#b8ffd9', intensity: 1.4 },
      Molten: { deep: '#1c0500', light: '#ffb347', intensity: 1.6 },
      Ink: { deep: '#f2efe8', light: '#121214', intensity: 1 },
    },
    frag: `
uniform float u_speed, u_scale, u_intensity, u_depth; uniform vec3 u_deep, u_light;
#define TAU 6.28318530718
void main(){
  float t = u_time * u_speed * .5 + 23.;
  vec2 uv = gl_FragCoord.xy / u_res;
  vec2 asp = vec2(u_res.x / u_res.y, 1.);
  vec2 p = mod(uv * asp * TAU * u_scale + (u_mouse - .5) * 1.2, TAU) - 250.;
  vec2 i = p; float c = 1.; float inten = .005;
  for (int n = 0; n < 5; n++) {
    float tt = t * (1. - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1. / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 5.; c = 1.17 - pow(c, 1.4);
  float v = pow(abs(c), 8.) * u_intensity;
  vec3 col = mix(u_deep, u_light, clamp(v, 0., 1.));
  col = mix(col * .55, col, mix(1., uv.y, u_depth));
  col += u_light * clamp(v - 1., 0., 2.) * .25;
  gl_FragColor = vec4(col, 1.);
}`
  },
  {
    id: 'chrome', name: 'Liquid Chrome', kicker: 'Metaballs · fake reflection',
    blurb: 'A 2D metaball field, its gradient turned into a normal and reflected off a studio softbox.',
    params: [
      { key: 'speed', label: 'Speed', min: 0, max: 2, step: .01, value: .6 },
      { key: 'count', label: 'Blobs', min: 2, max: 8, step: 1, value: 6 },
      { key: 'soft', label: 'Edge softness', min: .01, max: .4, step: .005, value: .06 },
      { key: 'iris', label: 'Iridescence', min: 0, max: 1, step: .01, value: .3 },
      { key: 'bg', label: 'Backdrop', type: 'color', value: '#0b0b10' },
      { key: 'tint', label: 'Metal', type: 'color', value: '#e9ecf2' },
    ],
    presets: {
      Chrome: { bg: '#0b0b10', tint: '#e9ecf2', iris: .3 },
      Gold: { bg: '#120c04', tint: '#ffcf7a', iris: .1 },
      Oil: { bg: '#050508', tint: '#8f96a8', iris: 1 },
      Porcelain: { bg: '#e8e6e1', tint: '#ffffff', iris: .2 },
    },
    frag: `
uniform float u_speed, u_soft, u_iris, u_count; uniform vec3 u_bg, u_tint;
vec3 pal(float t){ return .5 + .5*cos(6.28318*(t + vec3(0., .33, .67))); }
float field(vec2 p, float t){
  float s = 0.;
  for (int i = 0; i < 8; i++) {
    if (float(i) >= u_count) break;
    float fi = float(i);
    vec2 c = vec2(sin(t*(.4 + fi*.13) + fi*1.7), cos(t*(.35 + fi*.11) + fi*2.3)) * vec2(.62, .36);
    float r = .14 + .04*sin(fi*3.1 + t);
    vec2 d = p - c; s += r*r / (dot(d, d) + .004);
  }
  vec2 mp = (u_mouse - .5) * vec2(u_res.x/u_res.y, 1.);
  vec2 dm = p - mp; s += .022 / (dot(dm, dm) + .004);
  return s;
}
void main(){
  vec2 p = (gl_FragCoord.xy - .5*u_res) / u_res.y;
  float t = u_time * u_speed + 4.;
  float f = field(p, t);
  float e = .0025;
  vec2 g = vec2(field(p + vec2(e, 0.), t) - field(p - vec2(e, 0.), t), field(p + vec2(0., e), t) - field(p - vec2(0., e), t)) / (2.*e);
  float edge = smoothstep(1. - u_soft, 1. + u_soft, f);
  vec3 n = normalize(vec3(-g / (f*f) * .3, 1.));
  vec3 r = reflect(vec3(0., 0., -1.), n);
  float env = .5 + .5*r.y + .16;
  vec3 chrome = mix(vec3(.08), vec3(1.), smoothstep(.15, .95, env));
  chrome = mix(chrome, vec3(.02), smoothstep(.28, .34, env) * smoothstep(.44, .34, env) * .85);
  chrome += pow(max(0., r.x*.6 + r.y*.8), 24.) * 1.4;
  chrome *= u_tint;
  chrome = mix(chrome, chrome * pal(env*1.4 + f*.06 + t*.04) * 1.7, u_iris);
  vec3 bg = u_bg * (1. - .35*length(p));
  bg += u_tint * .06 * smoothstep(.25, 1., f);
  gl_FragColor = vec4(mix(bg, chrome, edge), 1.);
}`
  },
  {
    id: 'rings', name: 'Prism Rings', kicker: 'Polar tunnel · dispersion',
    blurb: 'Inverse-radius bands make a tunnel; each colour channel samples a slightly different radius.',
    params: [
      { key: 'speed', label: 'Speed', min: 0, max: 2, step: .01, value: .5 },
      { key: 'rings', label: 'Density', min: 1, max: 12, step: .01, value: 4 },
      { key: 'twist', label: 'Wobble', min: 0, max: 3, step: .01, value: 1 },
      { key: 'spread', label: 'Dispersion', min: 0, max: 12, step: .01, value: 4 },
      { key: 'bg', label: 'Void', type: 'color', value: '#05040a' },
      { key: 'glow', label: 'Glow', type: 'color', value: '#ffffff' },
    ],
    presets: {
      Prism: { bg: '#05040a', glow: '#ffffff', spread: 4 },
      Sodium: { bg: '#0a0502', glow: '#ff9a2e', spread: 1.5 },
      Mercury: { bg: '#02030c', glow: '#7f8cff', spread: 7 },
      Paper: { bg: '#efece6', glow: '#1a1a1a', spread: 2 },
    },
    frag: `
uniform float u_speed, u_rings, u_twist, u_spread; uniform vec3 u_bg, u_glow;
float ring(float rr, float a, float t){
  float w = sin(a*3. + t + rr*u_twist*4.) * .05 + sin(a*5. - t*1.3) * .025 * u_twist;
  float band = fract(u_rings * .1 / (rr + .04) + t * .35 + w * 3.);
  return smoothstep(0., .035, band) * smoothstep(.24, .035, band);
}
void main(){
  vec2 p = (gl_FragCoord.xy - .5*u_res) / u_res.y;
  p -= (u_mouse - .5) * .35;
  float t = u_time * u_speed;
  float a = atan(p.y, p.x), r = length(p);
  float s = u_spread * .01;
  vec3 L = vec3(ring(r*(1. - s), a, t), ring(r, a, t), ring(r*(1. + s), a, t));
  float fade = smoothstep(.0, .28, r);
  vec3 col = u_bg;
  bool light = dot(u_bg, vec3(.333)) > .5;
  vec3 lit = L * u_glow * fade * 1.3;
  col = light ? mix(u_bg, u_glow, clamp(dot(L, vec3(.333)) * fade, 0., 1.)) : col + lit + u_glow * .12 * exp(-r * 4.);
  gl_FragColor = vec4(col, 1.);
}`
  },
  {
    id: 'dither', name: 'Bayer Field', kicker: 'Ordered dither',
    blurb: 'A soft interference field quantised through an 8×8 Bayer matrix. Pointer drops ripples.',
    params: [
      { key: 'cell', label: 'Dot size', min: 2, max: 14, step: 1, value: 6, px: true },
      { key: 'speed', label: 'Speed', min: 0, max: 3, step: .01, value: .9 },
      { key: 'freq', label: 'Ripple frequency', min: .5, max: 6, step: .01, value: 2.2 },
      { key: 'bias', label: 'Exposure', min: -.5, max: .5, step: .01, value: 0 },
      { key: 'paper', label: 'Paper', type: 'color', value: '#0a0a0c' },
      { key: 'ink', label: 'Ink', type: 'color', value: '#e6e6ea' },
    ],
    presets: {
      Mono: { paper: '#0a0a0c', ink: '#e6e6ea' },
      Sodium: { paper: '#0d0d10', ink: '#ff9416' },
      Newsprint: { paper: '#efece6', ink: '#16161a' },
      Phosphor: { paper: '#03100a', ink: '#5dffb0' },
      Blueprint: { paper: '#0b2a6b', ink: '#dfe8ff' },
    },
    frag: `
uniform float u_cell, u_speed, u_freq, u_bias; uniform vec3 u_ink, u_paper;
float b2(vec2 a){ a = floor(a); return fract(a.x * .5 + a.y * a.y * .75); }
float b4(vec2 a){ return b2(.5 * a) * .25 + b2(a); }
float b8(vec2 a){ return b4(.5 * a) * .25 + b2(a); }
void main(){
  float cell = max(1., u_cell);
  vec2 cp = floor(gl_FragCoord.xy / cell);
  vec2 p = (cp * cell + .5*cell - .5*u_res) / u_res.y;
  float t = u_time * u_speed;
  vec2 m = (u_mouse - .5) * vec2(u_res.x / u_res.y, 1.);
  float d = length(p - m);
  float v = .5 + .5 * sin(d * u_freq * 9. - t * 2.2);
  v *= .55 + .45 * sin(p.x * 3. + t * .7 + sin(p.y * 4. - t * .5));
  v = mix(v, 1. - smoothstep(0., 1.1, d), .45);
  v = clamp(v + u_bias, 0., 1.);
  float on = step(b8(cp), v);
  vec2 f = fract(gl_FragCoord.xy / cell) - .5;
  float dotm = cell > 3.5 ? smoothstep(.5, .36, length(f)) : 1.;
  gl_FragColor = vec4(mix(u_paper, u_ink, on * dotm), 1.);
}`
  },
];
// The hero shows Silk; the wall shows the other four.
const WALL_SHADERS = [
  { def: 'caustics', cls: 't-s1' }, { def: 'chrome', cls: 't-s2' },
  { def: 'rings', cls: 't-s3' }, { def: 'dither', cls: 't-s4' },
];
const byId = Object.fromEntries(SHADERS.map(s => [s.id, s]));
SHADERS.forEach(s => { s.values = {}; s.params.forEach(p => s.values[p.key] = p.value); });

/* ═════════════════════════ Utilities ═════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
let motionOn = !reduceMotion.matches;
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const fmt = s => !isFinite(s) ? '0:00' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const icon = id => `<svg class="icon" aria-hidden="true"><use href="#${id}"/></svg>`;
const setRangeFill = el => el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%');
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('is-on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('is-on'), 1800); }

/* ═════════════════════════ WebGL engine ═════════════════════════ */
const VERT = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }';
const HEAD = 'precision highp float;\nuniform vec2 u_res; uniform float u_time; uniform vec2 u_mouse;\n';
const views = new Set();

class ShaderView {
  constructor(canvas, { dprCap = 1.5 } = {}) {
    this.c = canvas; this.dprCap = dprCap;
    this.gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
    this.failed = !this.gl;
    this.programs = new Map();
    this.mouse = [.5, .5]; this.target = [.5, .5];
    this.t = Math.random() * 20; this.playing = true; this.visible = true; this.dirty = true;
    if (this.failed) { canvas.style.background = 'radial-gradient(circle at 30% 30%, #3a3f52, #050507 70%)'; return; }
    const gl = this.gl, buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const move = e => { const r = canvas.getBoundingClientRect(); this.target = [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
    (canvas.closest('.card') || canvas).addEventListener('pointermove', move);
    canvas.addEventListener('pointermove', move);
    (canvas.closest('.card') || canvas).addEventListener('pointerleave', () => this.target = [.5, .5]);
    views.add(this);
  }
  setDef(def) {
    if (this.failed) return;
    this.def = def;
    if (!this.programs.has(def.id)) this.programs.set(def.id, this.compile(def));
    this.prog = this.programs.get(def.id); this.dirty = true;
  }
  compile(def) {
    const gl = this.gl;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(def.id, gl.getShaderInfoLog(s)); return s; };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, HEAD + def.frag));
    gl.bindAttribLocation(pr, 0, 'a');
    gl.linkProgram(pr);
    const loc = {};
    ['u_res', 'u_time', 'u_mouse', ...def.params.map(p => 'u_' + p.key)].forEach(n => loc[n] = gl.getUniformLocation(pr, n));
    return { pr, loc };
  }
  frame(dt) {
    if (this.failed || !this.prog) return false;
    const animating = this.playing && motionOn;
    const dx = this.target[0] - this.mouse[0], dy = this.target[1] - this.mouse[1];
    const moving = Math.abs(dx) + Math.abs(dy) > .0005;
    if (!animating && !moving && !this.dirty) return false;
    if (animating) this.t += dt;
    const k = 1 - Math.pow(.001, dt || .016);
    this.mouse[0] += dx * k; this.mouse[1] += dy * k;
    const gl = this.gl, c = this.c;
    const dpr = Math.min(devicePixelRatio || 1, this.dprCap);
    const w = Math.max(1, Math.round(c.clientWidth * dpr)), h = Math.max(1, Math.round(c.clientHeight * dpr));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    gl.viewport(0, 0, w, h);
    const { pr, loc } = this.prog;
    gl.useProgram(pr);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(loc.u_res, w, h);
    gl.uniform1f(loc.u_time, this.t);
    gl.uniform2f(loc.u_mouse, this.mouse[0], this.mouse[1]);
    for (const p of this.def.params) {
      const v = this.def.values[p.key];
      if (p.type === 'color') gl.uniform3fv(loc['u_' + p.key], hex2rgb(v));
      else gl.uniform1f(loc['u_' + p.key], p.px ? v * dpr : v);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    this.dirty = false;
    return true;
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  for (const v of views) if (v.visible && !v.suspended) v.frame(dt);
  if (viewer.open && viewer.mode === 'video') syncVideoUI();
  requestAnimationFrame(loop);
}

/* ═════════════════════════ Build the wall ═════════════════════════ */
const bento = $('#bento');
const tiles = [];
// full-width hero, rows of 2 · 3 · 2, then a full-width shader band to close
const ORDER = [['hero', 6], ['v1', 3], ['s1', 3], ['s2', 2], ['v3', 2], ['s3', 2], ['v2', 3], ['v4', 3], ['s4', 6]];
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    const t = e.target._tile; if (!t) continue;
    t.inView = e.isIntersecting;
    if (t.view) t.view.visible = e.isIntersecting;
    if (t.video) playIfAllowed(t);
  }
}, { threshold: .15 });

function playIfAllowed(t) {
  if (!t.video) return;
  if (t.inView && motionOn && !viewer.open) t.video.play().catch(() => {});
  else t.video.pause();
}

const reveal = label => `<div class="reveal" aria-hidden="true"><span class="label">${label}</span><span class="arrow">${icon('i-arrow')}</span></div>`;
let heroView;
ORDER.forEach(([slot, w], i) => {
  const el = document.createElement('article');
  el.className = `card w${w}`;
  el.style.setProperty('--i', i);
  let tile;
  if (slot === 'hero') {
    const def = byId.silk;
    el.classList.add('hero'); el.dataset.kind = 'shader';
    el.innerHTML = `
      <div class="tile-media"><canvas aria-hidden="true"></canvas></div>
      <div class="panel">
        <h1>Things that <em>move.</em></h1>
        <div class="meta"><span>Motion &amp; shaders</span><span id="clock"></span></div>
      </div>
      <button type="button" class="tile-hit" aria-label="Open Silk shader playground"></button>
      ${reveal('Open shader')}
      <button type="button" class="motion-toggle" aria-pressed="true" aria-label="Pause all motion">
        <svg class="icon when-on" aria-hidden="true"><use href="#i-pause"/></svg>
        <svg class="icon when-off" aria-hidden="true"><use href="#i-play"/></svg>
      </button>`;
    heroView = new ShaderView(el.querySelector('canvas'), { dprCap: 1 });
    heroView.setDef(def);
    tile = { el, kind: 'shader', data: def, view: heroView };
  } else if (slot[0] === 'v') {
    const v = VIDEOS.find(x => x.cls === 't-' + slot);
    el.dataset.kind = 'motion';
    el.innerHTML = `
      <div class="tile-media"><video muted loop playsinline preload="metadata" src="${v.src}#t=0.1"></video></div>
      <button type="button" class="tile-hit" aria-label="Open ${v.title} video"></button>
      ${reveal(v.title)}`;
    tile = { el, kind: 'motion', data: v, video: el.querySelector('video') };
  } else {
    const ws = WALL_SHADERS.find(x => x.cls === 't-' + slot), def = byId[ws.def];
    el.dataset.kind = 'shader';
    el.innerHTML = `
      <div class="tile-media"><canvas aria-hidden="true"></canvas></div>
      <button type="button" class="tile-hit" aria-label="Open ${def.name} shader playground"></button>
      ${reveal(def.name)}`;
    const view = new ShaderView(el.querySelector('canvas'), { dprCap: 1.25 });
    view.setDef(def);
    tile = { el, kind: 'shader', data: def, view };
  }
  el._tile = tile;
  el.querySelector('.tile-hit').addEventListener('click', () => openViewer(tile, el));
  bento.appendChild(el); tiles.push(tile); io.observe(el);
});

/* Reels sit on a background matching their own edge colour, so contain-fit never shows a seam. */
const edgeCanvas = document.createElement('canvas'); edgeCanvas.width = edgeCanvas.height = 1;
const edgeCtx = edgeCanvas.getContext('2d', { willReadFrequently: true });
function sampleEdge(t) {
  const v = t.video;
  if (!v.videoWidth || v.readyState < 2) return;
  try {
    edgeCtx.drawImage(v, 0, 0, 6, 6, 0, 0, 1, 1);
    const e = edgeCtx.getImageData(0, 0, 1, 1).data;
    t.el.style.setProperty('--edge', `rgb(${e[0]},${e[1]},${e[2]})`);
  } catch (e) { /* file:// taints the canvas: stay white */ }
}
setInterval(() => tiles.forEach(t => { if (t.video && t.inView && !viewer.open) sampleEdge(t); }), 300);
tiles.forEach(t => t.video && t.video.addEventListener('loadeddata', () => sampleEdge(t)));

/* local time in the hero panel, like a quiet status line */
const clock = $('#clock');
const tick = () => clock.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' local';
tick(); setInterval(tick, 15000);

/* filter */
const segBtns = [...document.querySelectorAll('.nav [data-filter]')];
function setFilter(f) {
  segBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.filter === f));
  bento.dataset.filter = f;
  let n = 0;
  tiles.forEach(t => {
    const show = f === 'all' || t.kind === f;
    t.el.classList.toggle('is-out', !show);
    t.el.classList.remove('is-entering');
    if (show) { void t.el.offsetWidth; t.el.style.setProperty('--i', n++); t.el.classList.add('is-entering'); }
  });
}
segBtns.forEach(b => b.addEventListener('click', () => setFilter(b.dataset.filter)));

/* global motion toggle */
const motionBtn = $('.motion-toggle');
function setMotion(on) {
  motionOn = on;
  motionBtn.setAttribute('aria-pressed', on);
  motionBtn.setAttribute('aria-label', on ? 'Pause all motion' : 'Resume all motion');
  tiles.forEach(playIfAllowed);
  views.forEach(v => v.dirty = true);
}
motionBtn.addEventListener('click', e => { e.stopPropagation(); setMotion(!motionOn); toast(motionOn ? 'Motion resumed' : 'Motion paused'); });
setMotion(motionOn);

/* ═════════════════════════ Viewer ═════════════════════════ */
const viewer = { el: $('#viewer'), panel: $('.viewer-panel'), open: false, mode: null, list: [], index: 0, origin: null, view: null };
const vVideo = $('#v-video'), vSeek = $('#vc-seek');
viewer.view = new ShaderView($('#v-canvas'), { dprCap: 1.5 });
viewer.view.visible = false;

function openViewer(tile, originEl) {
  const kind = tile.kind;
  viewer.mode = kind === 'motion' ? 'video' : 'shader';
  viewer.list = kind === 'motion' ? VIDEOS : SHADERS;
  viewer.index = viewer.list.indexOf(tile.data);
  viewer.origin = originEl;
  viewer.lastFocus = document.activeElement;
  viewer.el.dataset.mode = viewer.mode;
  viewer.el.hidden = false;
  viewer.open = true;
  document.body.classList.add('is-locked');
  // pause the wall behind the sheet
  tiles.forEach(t => { if (t.view) t.view.suspended = true; playIfAllowed(t); });
  heroView.suspended = true;
  let startAt = 0;
  if (tile.video) startAt = tile.video.currentTime || 0;
  show(viewer.index, startAt);
  flip(originEl, true);
  $('#v-close').focus({ preventScroll: true });
}

function show(i, startAt = 0) {
  const n = viewer.list.length;
  viewer.index = (i + n) % n;
  const item = viewer.list[viewer.index];
  $('#v-count').textContent = `${viewer.index + 1} / ${n}`;
  if (viewer.mode === 'video') {
    $('#viewer-kicker').textContent = item.kicker;
    $('#viewer-title').textContent = item.title;
    if (!vVideo.src.endsWith(encodeURI(item.src))) vVideo.src = item.src;
    vVideo.currentTime = startAt;
    vVideo.muted = false;
    vVideo.play().catch(() => { vVideo.muted = true; vVideo.play().catch(() => {}); });
    viewer.view.visible = false;
    pokeIdle();
  } else {
    $('#viewer-kicker').textContent = 'Shader';
    $('#viewer-title').textContent = item.name;
    viewer.view.setDef(item);
    viewer.view.visible = true; viewer.view.suspended = false; viewer.view.playing = true;
    vVideo.pause();
    buildControls(item);
  }
}

function closeViewer() {
  if (!viewer.open) return;
  viewer.open = false;
  vVideo.pause();
  viewer.view.visible = false;
  // carry tweaks & playhead back to the wall
  tiles.forEach(t => { if (t.view) { t.view.suspended = false; t.view.dirty = true; } });
  heroView.suspended = false; heroView.dirty = true;
  if (viewer.mode === 'video') {
    const t = tiles.find(t => t.data === viewer.list[viewer.index]);
    if (t && isFinite(vVideo.currentTime)) try { t.video.currentTime = vVideo.currentTime; } catch (e) {}
  }
  const origin = currentOrigin();
  flip(origin, false, () => {
    viewer.el.hidden = true;
    document.body.classList.remove('is-locked');
    vVideo.removeAttribute('src'); vVideo.load();
    tiles.forEach(playIfAllowed);
    (viewer.lastFocus || document.body).focus?.({ preventScroll: true });
  });
}

function currentOrigin() {
  const item = viewer.list[viewer.index];
  const t = tiles.find(t => t.data === item);
  return t && !t.el.classList.contains('is-out') ? t.el : null;
}

// FLIP: animate the sheet out of / back into the tile it came from (transform + opacity only).
function flip(originEl, opening, done) {
  const panel = viewer.panel, scrim = $('.viewer-scrim');
  const r = originEl && originEl.getBoundingClientRect();
  const visible = r && r.bottom > 0 && r.top < innerHeight;
  if (reduceMotion.matches || !visible) {
    panel.classList.remove('is-animating');
    if (opening) { panel.style.transform = ''; panel.style.opacity = ''; viewer.el.classList.add('is-open'); }
    else { viewer.el.classList.remove('is-open'); panel.style.opacity = '0'; done && setTimeout(() => { panel.style.opacity = ''; done(); }, reduceMotion.matches ? 0 : 200); panel.classList.add('is-animating'); }
    return;
  }
  panel.classList.remove('is-animating');
  panel.style.transform = '';
  const to = panel.getBoundingClientRect();
  const from = `translate(${r.left - to.left}px, ${r.top - to.top}px) scale(${r.width / to.width}, ${r.height / to.height})`;
  if (opening) {
    panel.style.transform = from; panel.style.opacity = '.4';
    void panel.offsetWidth;
    panel.classList.add('is-animating');
    viewer.el.classList.add('is-open');
    panel.style.transform = ''; panel.style.opacity = '';
  } else {
    panel.classList.add('is-animating');
    viewer.el.classList.remove('is-open');
    panel.style.transform = from; panel.style.opacity = '0';
    let fin = false;
    const end = () => { if (fin) return; fin = true; panel.classList.remove('is-animating'); panel.style.transform = ''; panel.style.opacity = ''; done && done(); };
    panel.addEventListener('transitionend', end, { once: true });
    setTimeout(end, 650);
  }
}

$('#v-prev').addEventListener('click', () => show(viewer.index - 1));
$('#v-next').addEventListener('click', () => show(viewer.index + 1));
viewer.el.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeViewer));

/* video controls */
const playBtn = $('#vc-play'), muteBtn = $('#vc-mute');
function togglePlay() { vVideo.paused ? vVideo.play() : vVideo.pause(); pokeIdle(); }
playBtn.addEventListener('click', togglePlay);
vVideo.addEventListener('click', togglePlay);
muteBtn.addEventListener('click', () => { vVideo.muted = !vVideo.muted; pokeIdle(); });
$('#vc-fs').addEventListener('click', () => { const s = $('#stage'); document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen?.(); });
vSeek.addEventListener('input', () => { if (vVideo.duration) vVideo.currentTime = vSeek.value / 1000 * vVideo.duration; setRangeFill(vSeek); pokeIdle(); });
let lastPlayState, lastMute;
function syncVideoUI() {
  const d = vVideo.duration || 0, t = vVideo.currentTime || 0;
  if (document.activeElement !== vSeek) { vSeek.value = d ? t / d * 1000 : 0; setRangeFill(vSeek); }
  $('#vc-time').textContent = `${fmt(t)} / ${fmt(d)}`;
  if (lastPlayState !== vVideo.paused) {
    lastPlayState = vVideo.paused;
    playBtn.innerHTML = icon(vVideo.paused ? 'i-play' : 'i-pause');
    playBtn.setAttribute('aria-label', vVideo.paused ? 'Play' : 'Pause');
  }
  if (lastMute !== vVideo.muted) {
    lastMute = vVideo.muted;
    muteBtn.innerHTML = icon(vVideo.muted ? 'i-mute' : 'i-sound');
    muteBtn.setAttribute('aria-label', vVideo.muted ? 'Unmute' : 'Mute');
  }
}
let idleTimer;
function pokeIdle() {
  const s = $('#stage'); s.classList.remove('is-idle'); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!vVideo.paused && !$('#vctl').matches(':hover, :focus-within')) s.classList.add('is-idle'); }, 2200);
}
$('#stage').addEventListener('pointermove', pokeIdle);

/* shader controls */
function buildControls(def) {
  const root = $('#controls');
  const ranges = def.params.filter(p => p.type !== 'color'), colors = def.params.filter(p => p.type === 'color');
  root.innerHTML = `
    <div class="ctl-group"><span class="mono">Shader</span>
      <div class="ctl-tabs">${SHADERS.map((s, i) => `<button type="button" class="chip" data-shader="${i}" aria-pressed="${s === def}">${s.name}</button>`).join('')}</div></div>
    <div class="ctl-group"><span class="mono">Presets</span>
      <div class="ctl-tabs">${Object.keys(def.presets).map(k => `<button type="button" class="chip" data-preset="${k}" aria-pressed="false">${k}</button>`).join('')}</div></div>
    <div class="ctl-group"><span class="mono">Parameters</span>
      ${ranges.map(p => `<label class="ctl-row"><span class="top"><span>${p.label}</span><output data-out="${p.key}"></output></span>
        <input type="range" data-key="${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${def.values[p.key]}"></label>`).join('')}</div>
    <div class="ctl-group"><span class="mono">Colour</span>
      <div class="swatches">${colors.map(p => `<label class="swatch"><span class="swatch-chip" data-chip="${p.key}"><input type="color" data-key="${p.key}" value="${def.values[p.key]}" aria-label="${p.label} colour"></span>${p.label}</label>`).join('')}</div></div>
    <div class="ctl-group"><span class="mono">Actions</span>
      <div class="ctl-actions">
        <button type="button" class="pill-btn" data-act="pause">${icon('i-pause')}<span>Pause</span></button>
        <button type="button" class="pill-btn" data-act="random">${icon('i-dice')}Randomise</button>
        <button type="button" class="pill-btn" data-act="reset">${icon('i-reset')}Reset</button>
        <button type="button" class="pill-btn is-primary" data-act="snap">${icon('i-camera')}Save PNG</button>
      </div></div>`;
  syncControls(def);
  root.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
    const p = def.params.find(p => p.key === inp.dataset.key);
    def.values[p.key] = p.type === 'color' ? inp.value : parseFloat(inp.value);
    markPreset(null); syncControls(def, inp); viewer.view.dirty = true;
  }));
  root.querySelectorAll('[data-shader]').forEach(b => b.addEventListener('click', () => { show(+b.dataset.shader); root.querySelector(`[data-shader="${b.dataset.shader}"]`)?.focus(); }));
  root.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    Object.assign(def.values, def.presets[b.dataset.preset]); syncControls(def); markPreset(b.dataset.preset); viewer.view.dirty = true;
  }));
  root.querySelector('[data-act="pause"]').addEventListener('click', e => {
    const v = viewer.view; v.playing = !v.playing;
    e.currentTarget.innerHTML = `${icon(v.playing ? 'i-pause' : 'i-play')}<span>${v.playing ? 'Pause' : 'Play'}</span>`;
  });
  root.querySelector('[data-act="random"]').addEventListener('click', () => { randomise(def); syncControls(def); markPreset(null); viewer.view.dirty = true; });
  root.querySelector('[data-act="reset"]').addEventListener('click', () => { def.params.forEach(p => def.values[p.key] = p.value); syncControls(def); markPreset(null); viewer.view.dirty = true; toast('Reset to defaults'); });
  root.querySelector('[data-act="snap"]').addEventListener('click', () => {
    const v = viewer.view; v.dirty = true; v.frame(0);
    const a = document.createElement('a'); a.download = `${def.id}-${Date.now()}.png`; a.href = v.c.toDataURL('image/png'); a.click();
    toast('Saved a PNG');
  });
}
function markPreset(name) { $('#controls').querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', b.dataset.preset === name)); }
function syncControls(def, except) {
  const root = $('#controls');
  def.params.forEach(p => {
    const inp = root.querySelector(`input[data-key="${p.key}"]`), v = def.values[p.key];
    if (inp !== except) inp.value = v;
    if (p.type === 'color') root.querySelector(`[data-chip="${p.key}"]`).style.background = v;
    else { setRangeFill(inp); root.querySelector(`[data-out="${p.key}"]`).textContent = (+v).toFixed(p.step >= 1 ? 0 : 2); }
  });
}
function randomise(def) {
  const hue = Math.random() * 360;
  const hsl = (h, s, l) => { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join(''); };
  let ci = 0;
  def.params.forEach(p => {
    if (p.type === 'color') {
      // first colour = dark ground, then vivid partners spaced around the wheel
      def.values[p.key] = ci === 0 ? hsl(hue + 180, 40, 6) : hsl(hue + (ci - 1) * 140 + Math.random() * 30, 85, 55 + Math.random() * 10);
      ci++;
    } else if (p.key !== 'speed') {
      const r = (Math.random() + Math.random()) / 2; // bias toward the middle
      const v = p.min + r * (p.max - p.min);
      def.values[p.key] = p.step >= 1 ? Math.round(v) : +v.toFixed(3);
    }
  });
}

/* keyboard */
document.addEventListener('keydown', e => {
  if (!viewer.open) return;
  const tag = e.target.tagName, isRange = e.target.type === 'range';
  if (e.key === 'Escape') { e.preventDefault(); closeViewer(); }
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !isRange) { e.preventDefault(); show(viewer.index + (e.key === 'ArrowRight' ? 1 : -1)); }
  else if (e.key === ' ' && viewer.mode === 'video' && tag !== 'BUTTON') { e.preventDefault(); togglePlay(); }
  else if ((e.key === 'm' || e.key === 'M') && viewer.mode === 'video') { vVideo.muted = !vVideo.muted; }
  else if ((e.key === 'f' || e.key === 'F') && viewer.mode === 'video') { $('#vc-fs').click(); }
  else if (e.key === 'Tab') { // focus trap
    const f = [...viewer.panel.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
    const first = f[0], lastEl = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastEl.focus(); }
    else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) last = performance.now(); });

requestAnimationFrame(loop);
</script>
</body>
</html>
